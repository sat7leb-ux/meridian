<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian — scheduling and call reservations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1F2A; --paper:#F6F4EF; --surface:#FFFFFF;
  --teal:#0E7C7B; --teal-600:#0A6362; --teal-100:#D8ECEB;
  --brass:#C08A2E; --brass-100:#F3E7CE;
  --mute:#6B7F88; --ok:#1E7A4B; --warn:#B45309; --stop:#A32C2C;
  --hairline:rgba(107,127,136,.26);
  --r-slot:4px; --r-field:8px; --r-card:14px; --r-sheet:20px;
  --raise:0 1px 2px rgba(11,31,42,.08);
  --float:0 8px 24px -8px rgba(11,31,42,.18);
  --ease:cubic-bezier(.2,.8,.2,1);
  --font-display:"Bricolage Grotesque",system-ui,sans-serif;
  --font-sans:"IBM Plex Sans",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.1;letter-spacing:-.02em;margin:0 0 .5em;text-wrap:balance}
h1{font-size:clamp(2.25rem,5vw,4rem)}
h2{font-size:clamp(1.75rem,3vw,2.25rem)}
h3{font-size:1.375rem}
p{margin:0 0 1rem;max-width:68ch}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:2px}
.tabular,time,.slot,.figure{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card)}
.mute{color:var(--mute)}
.small{font-size:.875rem}
.xs{font-size:.75rem}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.625rem 1.125rem;border-radius:var(--r-field);border:1px solid transparent;background:var(--teal);color:#fff;font-weight:500;cursor:pointer;transition:background 120ms var(--ease),border-color 120ms var(--ease)}
.btn:hover{background:var(--teal-600)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--hairline)}
.btn-ghost:hover{background:transparent;border-color:var(--teal)}
.btn-quiet{background:transparent;border-color:transparent;color:var(--mute);padding:.4rem .6rem}
.btn-quiet:hover{background:transparent;color:var(--ink)}
.btn-sm{padding:.35rem .7rem;font-size:.875rem}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline)}
.top .wrap{display:flex;align-items:center;gap:1.5rem;height:64px}
.brand{display:flex;align-items:center;gap:.6rem;font-family:var(--font-display);font-weight:700;font-size:1.125rem;letter-spacing:-.03em}
.dial{width:22px;height:22px;flex:none}
nav.main{margin-left:auto;display:flex;gap:.25rem;align-items:center}
nav.main a{padding:.45rem .7rem;border-radius:var(--r-field);text-decoration:none;font-size:.9375rem;color:var(--mute)}
nav.main a:hover{color:var(--ink)}
nav.main a.active{color:var(--ink);background:var(--teal-100)}
@media(max-width:820px){nav.main a.hide-sm{display:none}}

/* ---------- hero ---------- */
.hero{padding:72px 0 56px;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr;gap:32px}}
.eyebrow{font-size:.9375rem;color:var(--teal);font-weight:500;margin-bottom:1rem}
.lede{font-size:1.125rem;color:var(--mute);max-width:46ch}
.hero-actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.75rem}
.meridian-lines{position:absolute;inset:0;pointer-events:none;opacity:.5}

/* ---------- live booker (hero) ---------- */
.booker{padding:20px;box-shadow:var(--float)}
.booker-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:.75rem}
.tzrow{display:flex;align-items:center;gap:.5rem;font-size:.875rem;color:var(--mute);margin-bottom:1rem;flex-wrap:wrap}
select.tz{font:inherit;font-size:.875rem;padding:.3rem .5rem;border:1px solid var(--hairline);border-radius:var(--r-field);background:var(--surface);color:var(--ink)}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.slot{border-radius:var(--r-slot);border:1px solid var(--hairline);background:var(--surface);padding:.6rem .4rem;text-align:center;cursor:pointer;font-size:.9375rem;transition:border-color 120ms var(--ease),background 120ms var(--ease),color 120ms var(--ease)}
.slot:hover:not([disabled]){border-color:var(--teal)}
.slot[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.slot[disabled]{opacity:.35;cursor:not-allowed}

/* ---------- sections ---------- */
section{padding:64px 0;border-top:1px solid var(--hairline)}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
@media(max-width:880px){.cols3{grid-template-columns:1fr}}
.feature{padding:24px}
.feature h3{font-size:1.125rem;margin-bottom:.35rem}
.feature p{font-size:.9375rem;color:var(--mute);margin:0}
.rule-list{display:grid;gap:0;border:1px solid var(--hairline);border-radius:var(--r-card);overflow:hidden;background:var(--surface)}
.rule-list > div{display:flex;gap:1rem;padding:16px 20px;border-bottom:1px solid var(--hairline);align-items:baseline}
.rule-list > div:last-child{border-bottom:0}
.rule-list b{font-weight:600;min-width:190px}
.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media(max-width:880px){.price-grid{grid-template-columns:1fr}}
.plan{padding:28px}
.plan.featured{border-color:var(--teal);box-shadow:var(--float)}
.plan .figure{font-size:2.25rem;font-weight:500}
.plan ul{list-style:none;padding:0;margin:1.25rem 0 0;font-size:.9375rem}
.plan li{padding:.35rem 0;border-bottom:1px solid var(--hairline)}
.plan li:last-child{border-bottom:0}

/* ---------- booking funnel ---------- */
.funnel{display:grid;grid-template-columns:320px 1fr;gap:32px;padding:40px 0 80px;align-items:start}
@media(max-width:900px){.funnel{grid-template-columns:1fr}}
.summary{padding:24px;position:sticky;top:88px}
@media(max-width:900px){.summary{position:static}}
.steps{display:flex;gap:.5rem;margin-bottom:24px;flex-wrap:wrap}
.step{font-size:.8125rem;color:var(--mute);display:flex;align-items:center;gap:.4rem}
.step .n{width:20px;height:20px;border-radius:999px;border:1px solid var(--hairline);display:grid;place-items:center;font-family:var(--font-mono);font-size:.6875rem}
.step.on{color:var(--ink)}
.step.on .n{background:var(--teal);border-color:var(--teal);color:#fff}
.step.done .n{background:var(--teal-100);border-color:var(--teal-100);color:var(--teal-600)}
.svc{display:flex;gap:1rem;align-items:flex-start;width:100%;text-align:left;padding:18px 20px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);cursor:pointer;margin-bottom:12px;transition:border-color 120ms var(--ease)}
.svc:hover{border-color:var(--teal)}
.svc .meta{margin-left:auto;text-align:right;white-space:nowrap}
.staffrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.staffcard{display:flex;gap:.75rem;align-items:center;padding:12px;border:1px solid var(--hairline);border-radius:var(--r-card);background:var(--surface);cursor:pointer;text-align:left}
.staffcard[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-100)}
.av{width:34px;height:34px;border-radius:999px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:.8125rem;font-weight:600;flex:none}
.calwrap{display:grid;grid-template-columns:1fr 260px;gap:28px}
@media(max-width:760px){.calwrap{grid-template-columns:1fr}}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:.75rem;color:var(--mute);padding-bottom:6px}
.day{aspect-ratio:1;border:1px solid transparent;border-radius:var(--r-field);background:transparent;cursor:pointer;display:grid;place-items:center;gap:2px;font-family:var(--font-mono);font-size:.875rem;position:relative}
.day:hover:not([disabled]){border-color:var(--teal)}
.day[disabled]{color:var(--mute);opacity:.4;cursor:not-allowed}
.day[aria-pressed="true"]{background:var(--teal);color:#fff}
.dots{display:flex;gap:2px;position:absolute;bottom:7px}
.dot{width:3px;height:3px;border-radius:999px;background:var(--brass)}
.day[aria-pressed="true"] .dot{background:#fff}
.field{margin-bottom:16px}
.field label{display:block;font-size:.875rem;font-weight:500;margin-bottom:.35rem}
.field .help{font-size:.8125rem;color:var(--mute);margin-bottom:.35rem}
.field input,.field textarea,.field select{width:100%;padding:.6rem .75rem;border:1px solid var(--hairline);border-radius:var(--r-field);background:var(--surface);font:inherit;color:var(--ink)}
.field textarea{min-height:92px;resize:vertical}
.req{color:var(--stop)}
.err{color:var(--stop);font-size:.8125rem;margin-top:.25rem}
.methods{display:flex;gap:8px;flex-wrap:wrap}
.method{padding:.5rem .9rem;border:1px solid var(--hairline);border-radius:999px;background:var(--surface);cursor:pointer;font-size:.875rem}
.method[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-100);color:var(--teal-600)}
.confirm-mark{width:56px;height:56px;border-radius:999px;background:var(--teal-100);display:grid;place-items:center;margin-bottom:1rem}
.confirm-mark svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .45s var(--ease) .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.kv{display:grid;grid-template-columns:130px 1fr;gap:.35rem 1rem;font-size:.9375rem;margin:1.25rem 0}
.kv dt{color:var(--mute)}
.kv dd{margin:0}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 64px)}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}}
.side{border-right:1px solid var(--hairline);padding:24px 16px;background:var(--surface)}
.side h4{font-size:.75rem;color:var(--mute);font-family:var(--font-sans);font-weight:600;margin:20px 0 6px}
.side button{display:flex;width:100%;gap:.6rem;align-items:center;padding:.5rem .7rem;border:0;background:transparent;border-radius:var(--r-field);cursor:pointer;font-size:.9375rem;color:var(--mute);text-align:left}
.side button:hover{color:var(--ink)}
.side button.active{background:var(--teal-100);color:var(--teal-600);font-weight:500}
.main{padding:32px 28px 72px;max-width:1100px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:24px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
@media(max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{padding:18px 20px}
.tile .figure{font-size:1.75rem;font-weight:500;display:block;line-height:1.2}
.tile .lbl{font-size:.8125rem;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:.9375rem}
th{text-align:left;font-size:.75rem;color:var(--mute);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--hairline)}
td{padding:12px 14px;border-bottom:1px solid var(--hairline);vertical-align:middle}
tr:last-child td{border-bottom:0}
.pill{border-radius:999px;padding:.1rem .6rem;font-size:.75rem;font-weight:500;white-space:nowrap}
.p-confirmed{background:rgba(30,122,75,.12);color:var(--ok)}
.p-pending{background:rgba(180,83,9,.12);color:var(--warn)}
.p-cancelled{background:rgba(163,44,44,.12);color:var(--stop)}
.p-completed{background:rgba(107,127,136,.14);color:var(--mute)}
.empty{padding:48px 24px;text-align:center;color:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:10px;height:132px;padding-top:8px}
.bar{flex:1;background:var(--teal-100);border-radius:3px 3px 0 0;position:relative;min-height:3px}
.bar span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:.6875rem;color:var(--mute)}
.bar b{position:absolute;top:-19px;left:0;right:0;text-align:center;font-size:.6875rem;font-family:var(--font-mono);color:var(--mute)}
.bar.today{background:var(--teal)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--paper);padding:.7rem 1.1rem;border-radius:var(--r-field);box-shadow:var(--float);opacity:0;pointer-events:none;transition:opacity 200ms var(--ease),transform 200ms var(--ease);z-index:90;font-size:.9375rem}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
footer{border-top:1px solid var(--hairline);padding:32px 0;color:var(--mute);font-size:.875rem}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
/* =====================================================================
   1. TIMEZONE CORE — wall-clock in an IANA zone <-> UTC instants
   ===================================================================== */
function zoneOffsetMinutes(date, tz){
  const dtf = new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,
    year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const p = {}; for(const part of dtf.formatToParts(date)) p[part.type]=part.value;
  const asUTC = Date.UTC(+p.year, p.month-1, +p.day, (+p.hour)%24, +p.minute, +p.second);
  return (asUTC - date.getTime())/60000;
}
/** local wall-clock in tz -> real UTC instant (DST-safe, two passes) */
function zonedToUtc(y, m, d, h, min, tz){
  const guess = Date.UTC(y, m-1, d, h, min);
  let off = zoneOffsetMinutes(new Date(guess), tz);
  let ts  = guess - off*60000;
  off = zoneOffsetMinutes(new Date(ts), tz);
  return new Date(guess - off*60000);
}
function partsInZone(date, tz){
  const dtf = new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,
    year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',weekday:'short'});
  const p={}; for(const x of dtf.formatToParts(date)) p[x.type]=x.value;
  return {y:+p.year, m:+p.month, d:+p.day, h:(+p.hour)%24, min:+p.minute};
}
function isoDateInZone(date, tz){
  const p = partsInZone(date, tz);
  return `${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`;
}
function fmtTime(date, tz){
  return new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false}).format(date);
}
function fmtDateLong(date, tz){
  return new Intl.DateTimeFormat('en-GB',{timeZone:tz,weekday:'long',day:'numeric',month:'long'}).format(date);
}
function fmtFull(date, tz){ return fmtDateLong(date,tz)+', '+fmtTime(date,tz); }
function zoneLabel(tz){
  const off = zoneOffsetMinutes(new Date(), tz);
  const s = off<0?'-':'+', a=Math.abs(off);
  return tz.replace(/_/g,' ')+' (UTC'+s+String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0')+')';
}
function weekdayInZone(date, tz){
  const p = partsInZone(date, tz);
  return new Date(Date.UTC(p.y, p.m-1, p.d)).getUTCDay(); // 0 = Sunday
}

/* =====================================================================

   ===================================================================== */
const ORG = { name:'Meridian Demo Co.', slug:'meridian-demo', tz:'Asia/Beirut', currency:'USD' };

const STAFF = [

const FORM_FIELDS = [

  {key:'email',     label:'Email',      type:'email',    required:true,  system:true},

const BLOCKED = [ /* vacation, holidays — UTC instants */ ];

// seed a few bookings so the dashboard and the slot grid are not empty
const BOOKINGS = [];
(function seed(){
  const today = new Date();
  const mk = (dayOffset, hourLocal, staffId, serviceId, name, email, status) => {
    const base = new Date(today.getTime() + dayOffset*86400000);
    const p = partsInZone(base, ORG.tz);

      method: svc.methods[0],
      customer:{full_name:name, email, phone:'', company:'', subject:'Network or connectivity', notes:''},
      customerTz: ORG.tz, price: svc.price

  };
  mk(-6,10,'s1','v2','Nadia Saad','nadia@example.com','completed');
  mk(-4,15,'s2','v1','Georges Rizk','georges@example.com','completed');
  mk(-3,11,'s1','v1','Hadi Merhi','hadi@example.com','no_show');
  mk(-1, 9,'s3','v2','Leila Chami','leila@example.com','completed');
  mk( 0,11,'s1','v1','Karim Daou','karim@example.com','confirmed');

/* =====================================================================
   3. SLOT ENGINE
   working hours − bookings(+buffers) − blocks − notice − horizon
   ===================================================================== */
function busyIntervalsFor(staffId){
  const out = [];
  for(const b of BOOKINGS){
    if(b.staffId !== staffId) continue;
    if(b.status === 'cancelled' || b.status === 'no_show') continue;
    const svc = SERVICES.find(s=>s.id===b.serviceId);
    out.push({
      start:new Date(b.start.getTime() - svc.bufferBefore*60000),
      end:  new Date(b.end.getTime()   + svc.bufferAfter*60000)
    });
  }
  for(const x of BLOCKED) out.push(x);
  return out;
}
function mergeBusy(list){
  const s = list.slice().sort((a,b)=>a.start-b.start);
  const out=[];
  for(const iv of s){
    const last = out[out.length-1];
    if(last && iv.start <= last.end){ if(iv.end > last.end) last.end = iv.end; }
    else out.push({start:new Date(iv.start), end:new Date(iv.end)});
  }
  return out;
}
/** Working windows for one local day, as UTC instants. */
function windowsForDay(staffId, isoDate){
  const st = STAFF.find(x=>x.id===staffId);
  const [y,m,d] = isoDate.split('-').map(Number);
  const weekday = new Date(Date.UTC(y,m-1,d)).getUTCDay();
  const rules = (SCHEDULE[staffId]||{})[weekday] || [];
  return rules.map(([a,b])=>{
    const [ah,am]=a.split(':').map(Number), [bh,bm]=b.split(':').map(Number);
    return { start: zonedToUtc(y,m,d,ah,am,st.tz), end: zonedToUtc(y,m,d,bh,bm,st.tz) };
  });
}
function subtract(windows, busy){
  let result = windows.map(w=>({start:new Date(w.start), end:new Date(w.end)}));
  for(const b of mergeBusy(busy)){
    const next=[];
    for(const w of result){
      if(b.end <= w.start || b.start >= w.end){ next.push(w); continue; }
      if(b.start > w.start) next.push({start:w.start, end:new Date(b.start)});
      if(b.end   < w.end)   next.push({start:new Date(b.end), end:w.end});
    }
    result = next;
  }
  return result;
}
/** Slots for one staff member on one of THEIR local days. */
function slotsForDay(service, staffId, isoDate, now){
  now = now || new Date();
  const earliest = new Date(now.getTime() + service.notice*60000);
  const horizon  = new Date(now.getTime() + service.maxAdvanceDays*86400000);
  const free = subtract(windowsForDay(staffId, isoDate), busyIntervalsFor(staffId));

  const dayCount = BOOKINGS.filter(b =>
    b.staffId===staffId && b.status!=='cancelled' &&
    isoDateInZone(b.start, STAFF.find(s=>s.id===staffId).tz)===isoDate).length;
  if(service.maxPerDay && dayCount >= service.maxPerDay) return [];

  const out=[];
  const stepMs = service.step*60000, durMs = service.duration*60000;
  for(const w of free){
    let cursor = new Date(w.start.getTime() + service.bufferBefore*60000);
    // align to the step grid
    const rem = cursor.getTime() % stepMs;
    if(rem !== 0) cursor = new Date(cursor.getTime() + (stepMs - rem));
    while(cursor.getTime() + durMs + service.bufferAfter*60000 <= w.end.getTime()){
      const start = new Date(cursor);
      if(start >= earliest && start <= horizon) out.push({start, end:new Date(start.getTime()+durMs)});
      cursor = new Date(cursor.getTime() + stepMs);
    }
  }
  return out.sort((a,b)=>a.start-b.start);
}
/** All slots for a service across selected staff, grouped by the DISPLAY zone. */
function slotsForRange(service, staffIds, fromIso, days, displayTz){
  const map = {};
  for(const staffId of staffIds){
    for(let i=-1;i<=days;i++){
      const [y,m,d] = fromIso.split('-').map(Number);
      const base = new Date(Date.UTC(y,m-1,d) + i*86400000);
      const iso = base.toISOString().slice(0,10);
      for(const s of slotsForDay(service, staffId, iso)){
        const key = isoDateInZone(s.start, displayTz);
        (map[key] ||= []).push({...s, staffId});
      }
    }
  }
  for(const k of Object.keys(map)){
    const seen = new Set();
    map[k] = map[k]
      .filter(s => { const t=s.start.getTime()+'|'+s.staffId; if(seen.has(t)) return false; seen.add(t); return true; })
      .sort((a,b)=>a.start-b.start);
  }
  return map;
}

function drawSteps(){

function stepTime(pane){
  const svc = flow.service;
  pane.appendChild(el('<h2>Pick a time</h2>'));

  if(svc.staff.length>1){
    pane.appendChild(el('<p class="small" style="font-weight:500;margin-bottom:.5rem">Who would you like?</p>'));

  const cur = flow.monthCursor;

  const grouped = slotsForRange(svc, [flow.staffId], firstIso, 42, flow.tz);

  const head = el(`<div class="calhead">

  const grid = el('<div class="month"></div>');

    const list = grouped[iso] || [];

      <span class="dots">${'<span class="dot"></span>'.repeat(has?density:0)}</span></button>`);

      g.appendChild(b);
    }
    slotBox.appendChild(g);
    if(list.length) slotBox.appendChild(el(`<p class="xs mute" style="margin-top:.75rem">Ends ${flow.slot?fmtTime(flow.slot.end,flow.tz):'after '+flow.service.duration+' minutes'} · buffer ${flow.service.bufferAfter} min after</p>`));
  }

  const next = el('<button class="btn" style="margin-top:24px" '+(flow.slot?'':'disabled')+'>Continue to your details</button>');

function stepDetails(pane){
  const svc = flow.service;
  pane.appendChild(el('<h2>Your details</h2>'));

  if(svc.methods.length>1){
    pane.appendChild(el('<p class="small" style="font-weight:500;margin-bottom:.5rem">How should we meet?</p>'));

      row.appendChild(b);
    }
    pane.appendChild(row);
  }

  const form = el('<div style="max-width:520px"></div>');
  for(const f of FORM_FIELDS){
    const id = 'f_'+f.key;
    const wrapper = el(`<div class="field"><label for="${id}">${f.label}${f.required?' <span class="req">*</span>':''}</label>${
      f.help?`<div class="help">${f.help}</div>`:''}</div>`);

    else if(f.type==='select') input = el(`<select id="${id}"><option value="">Choose…</option>${f.options.map(o=>`<option>${o}</option>`).join('')}</select>`);
    else input = el(`<input id="${id}" type="${f.type}">`);
    input.value = flow.answers[f.key] || '';

    form.appendChild(wrapper);
  }
  pane.appendChild(form);

  const submit = el('<button class="btn">Confirm booking</button>');
  submit.addEventListener('click',()=>{
    let ok = true;
    for(const f of FORM_FIELDS){
      const wrapper = document.getElementById('f_'+f.key).closest('.field');

        err.textContent='That email address does not look complete.'; err.classList.remove('hidden'); ok=false; }

    if(!ok){ toast('Check the highlighted fields.'); return; }

    // final conflict check — the database constraint is the real guarantee
    const stillFree = slotsForDay(flow.service, flow.staffId, isoDateInZone(flow.slot.start, STAFF.find(s=>s.id===flow.staffId).tz))
      .some(s=>+s.start===+flow.slot.start);
    if(!stillFree){ toast('That time was taken a moment ago. Pick another.'); flow.step=2; flow.slot=null; drawSteps(); return; }

    const b = {
      id:'bk'+Math.random().toString(36).slice(2,8),
      ref:'MRD-'+Math.random().toString(36).slice(2,8).toUpperCase(),
      serviceId:flow.service.id, staffId:flow.staffId,
      start:flow.slot.start, end:flow.slot.end, status:'confirmed',
      method:flow.method, customer:{...flow.answers}, customerTz:flow.tz, price:flow.service.price
    };
    BOOKINGS.push(b);
    flow.booking = b; flow.step = 4;
    drawSummary(); drawSteps();
  });
  pane.appendChild(submit);
}

function icsFor(b){
  const svc = SERVICES.find(s=>s.id===b.serviceId);
  const st = STAFF.find(s=>s.id===b.staffId);
  const z = d => d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Meridian//EN','BEGIN:VEVENT',
    'UID:'+b.ref+'@meridian','DTSTAMP:'+z(new Date()),'DTSTART:'+z(b.start),'DTEND:'+z(b.end),
    'SUMMARY:'+svc.name+' with '+st.name,
    'DESCRIPTION:Reference '+b.ref+'. '+METHOD_LABEL[b.method]+'.',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
}

function stepConfirm(pane){
  const b = flow.booking;
  const svc = SERVICES.find(s=>s.id===b.serviceId);
  const st = STAFF.find(s=>s.id===b.staffId);
  const box = el(`<div class="card" style="padding:32px;max-width:620px">
    <div class="confirm-mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none">
      <path d="M4 12.5l5 5L20 6.5" stroke="#0E7C7B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h2 style="margin-bottom:.25rem">You are booked</h2>
    <p class="mute small">We sent a confirmation to ${b.customer.email}. Reference <span class="tabular">${b.ref}</span>.</p>
    <dl class="kv">
      <dt>Service</dt><dd>${svc.name}</dd>
      <dt>With</dt><dd>${st.name}</dd>
      <dt>When</dt><dd class="tabular">${fmtFull(b.start, b.customerTz)}</dd>
      <dt>Your zone</dt><dd>${b.customerTz}</dd>
      <dt>Their zone</dt><dd class="tabular">${fmtTime(b.start, st.tz)} in ${st.tz}</dd>
      <dt>How</dt><dd>${METHOD_LABEL[b.method]}</dd>
      ${b.price?`<dt>Price</dt><dd class="tabular">${money(b.price,ORG.currency)}</dd>`:''}
    </dl>
    <div style="display:flex;gap:.6rem;flex-wrap:wrap">
      <button class="btn" id="ics">Add to calendar</button>
      <button class="btn btn-ghost" id="resched">Move to a new time</button>
      <button class="btn btn-ghost" id="cancel">Cancel this booking</button>
    </div>
    <p class="xs mute" style="margin-top:1.25rem">Reminders will go out 24 hours and 2 hours before. This link works without an account.</p>
  </div>`);
  pane.appendChild(box);

  box.querySelector('#ics').addEventListener('click',()=>{
    const blob = new Blob([icsFor(b)],{type:'text/calendar'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = b.ref+'.ics'; a.click();
    URL.revokeObjectURL(a.href);
    toast('Calendar file downloaded.');
  });
  box.querySelector('#resched').addEventListener('click',()=>{
    const i = BOOKINGS.indexOf(b); if(i>-1) BOOKINGS.splice(i,1);
    flow.step=2; flow.slot=null; drawSummary(); drawSteps();
    toast('Pick the new time. The old slot is free again.');
  });
  box.querySelector('#cancel').addEventListener('click',()=>{
    b.status='cancelled';
    toast('Booking cancelled. The slot is open again.');
    flow.step=1; flow.service=null; flow.slot=null; flow.dateIso=null; flow.answers={};
    drawSummary(); drawSteps();
  });
}

let appPage = 'dashboard';
function renderApp(){
  view.innerHTML='';
  const shell = el(`<div class="app">
    <aside class="side">
      <h4>Overview</h4>
      <button data-p="dashboard">Dashboard</button>
      <button data-p="calendar">Calendar</button>
      <button data-p="appointments">Appointments</button>
      <h4>Manage</h4>
      <button data-p="services">Services</button>
      <button data-p="availability">Availability</button>
      <button data-p="customers">Customers</button>
      <button data-p="staff">Staff</button>
      <h4>Configure</h4>
      <button data-p="forms">Booking form</button>
      <button data-p="notifications">Notifications</button>
      <button data-p="settings">Settings</button>
    </aside>
    <div class="main" id="appMain"></div>
  </div>`);
  view.appendChild(shell);
  shell.querySelectorAll('.side button').forEach(b=>{
    b.classList.toggle('active', b.dataset.p===appPage);
    b.addEventListener('click',()=>{ appPage=b.dataset.p; renderApp(); });
  });
  ({dashboard:pgDashboard, calendar:pgCalendar, appointments:pgAppointments, services:pgServices,
    availability:pgAvailability, customers:pgCustomers, staff:pgStaff, forms:pgForms,
    notifications:pgNotifications, settings:pgSettings}[appPage])(document.getElementById('appMain'));
}
const live = ()=>BOOKINGS.filter(b=>b.status!=='cancelled');
function statusPill(s){
  const cls = {confirmed:'p-confirmed',pending:'p-pending',cancelled:'p-cancelled',completed:'p-completed',no_show:'p-cancelled'}[s]||'p-completed';
  return `<span class="pill ${cls}">${s.replace('_',' ')}</span>`;
}

function pgDashboard(m){
  const todayIso = isoDateInZone(new Date(), ORG.tz);
  const today = live().filter(b=>isoDateInZone(b.start,ORG.tz)===todayIso);
  const upcoming = live().filter(b=>b.start>new Date()).sort((a,b)=>a.start-b.start);
  const revenue = BOOKINGS.filter(b=>['confirmed','completed','paid'].includes(b.status)).reduce((s,b)=>s+b.price,0);
  const noShows = BOOKINGS.filter(b=>b.status==='no_show').length;

  m.appendChild(el(`<div class="page-head"><div><h2 style="margin:0">Today</h2>
    <p class="small mute" style="margin:0">${fmtDateLong(new Date(), ORG.tz)} · ${ORG.tz}</p></div>
    <a class="btn btn-ghost btn-sm" href="#/book">Open public booking page</a></div>`));

  m.appendChild(el(`<div class="tiles">
    <div class="card tile"><span class="figure">${today.length}</span><span class="lbl">Appointments today</span></div>
    <div class="card tile"><span class="figure">${upcoming.length}</span><span class="lbl">Upcoming</span></div>
    <div class="card tile"><span class="figure">${money(revenue,ORG.currency)}</span><span class="lbl">Booked revenue</span></div>
    <div class="card tile"><span class="figure">${noShows}</span><span class="lbl">No-shows</span></div>
  </div>`));

  // last 7 days chart
  const counts = [];
  for(let i=6;i>=0;i--){
    const d = new Date(Date.now()-i*86400000);
    const iso = isoDateInZone(d, ORG.tz);
    counts.push({iso, label:new Intl.DateTimeFormat('en-GB',{weekday:'short',timeZone:ORG.tz}).format(d),
      n:BOOKINGS.filter(b=>isoDateInZone(b.start,ORG.tz)===iso).length, today:i===0});
  }
  const max = Math.max(1,...counts.map(c=>c.n));
  m.appendChild(el(`<div class="card" style="padding:20px 20px 34px;margin-bottom:28px">
    <p class="small" style="font-weight:500;margin-bottom:.25rem">Bookings, last seven days</p>
    <div class="bars">${counts.map(c=>`<div class="bar ${c.today?'today':''}" style="height:${Math.max(4,(c.n/max)*100)}%"><b>${c.n}</b><span>${c.label}</span></div>`).join('')}</div>
  </div>`));

  m.appendChild(el(`<h3>Next up</h3>`));
  m.appendChild(bookingTable(upcoming.slice(0,6)));
}

function bookingTable(rows){
  if(rows.length===0) return el('<div class="card empty">Nothing here yet. When someone books, it lands in this list.</div>');
  const t = el(`<div class="card" style="overflow:hidden"><table>
    <thead><tr><th>When</th><th>Service</th><th>Customer</th><th>Staff</th><th>Method</th><th>Status</th><th></th></tr></thead>
    <tbody></tbody></table></div>`);
  const tb = t.querySelector('tbody');
  for(const b of rows){
    const svc = SERVICES.find(s=>s.id===b.serviceId), st = STAFF.find(s=>s.id===b.staffId);
    const tr = el(`<tr>
      <td class="tabular" style="white-space:nowrap">${new Intl.DateTimeFormat('en-GB',{timeZone:ORG.tz,day:'2-digit',month:'short'}).format(b.start)} ${fmtTime(b.start,ORG.tz)}</td>
      <td>${svc.name}</td>
      <td>${b.customer.full_name}<div class="xs mute">${b.customer.email}</div></td>
      <td>${st.name.split(' ')[0]}</td>
      <td class="small">${METHOD_LABEL[b.method]}</td>
      <td>${statusPill(b.status)}</td>
      <td style="text-align:right"></td></tr>`);
    if(b.status==='confirmed'||b.status==='pending'){
      const x = el('<button class="btn btn-quiet btn-sm">Cancel</button>');
      x.addEventListener('click',()=>{ b.status='cancelled'; toast('Cancelled. The slot is open again.'); renderApp(); });
      tr.lastElementChild.appendChild(x);
    }
    tb.appendChild(tr);
  }
  return t;
}

function pgAppointments(m){
  m.appendChild(el('<div class="page-head"><h2 style="margin:0">Appointments</h2></div>'));
  const filters = el('<div class="methods" style="margin-bottom:20px"></div>');
  let current = 'all';
  const all = ()=>BOOKINGS.slice().sort((a,b)=>b.start-a.start);
  const box = el('<div></div>');
  for(const f of ['all','confirmed','pending','completed','cancelled','no_show']){
    const b = el(`<button class="method" aria-pressed="${f===current}">${f.replace('_',' ')}</button>`);
    b.addEventListener('click',()=>{
      current=f; filters.querySelectorAll('.method').forEach(x=>x.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
      box.innerHTML=''; box.appendChild(bookingTable(f==='all'?all():all().filter(x=>x.status===f)));
    });
    filters.appendChild(b);
  }
  m.appendChild(filters);
  box.appendChild(bookingTable(all()));
  m.appendChild(box);
}

function pgCalendar(m){
  m.appendChild(el('<div class="page-head"><div><h2 style="margin:0">Calendar</h2><p class="small mute" style="margin:0">Week view · '+ORG.tz+'</p></div></div>'));
  const start = new Date(); start.setHours(0,0,0,0);
  const dow = new Date().getDay();
  const monday = new Date(start.getTime() - ((dow+6)%7)*86400000);
  const cols = el('<div class="card" style="padding:0;overflow:auto"><div style="display:grid;grid-template-columns:56px repeat(7,minmax(104px,1fr));min-width:760px"></div></div>');
  const g = cols.firstElementChild;
  g.appendChild(el('<div></div>'));
  for(let i=0;i<7;i++){
    const d = new Date(monday.getTime()+i*86400000);
    g.appendChild(el(`<div style="padding:10px 8px;border-bottom:1px solid var(--hairline);text-align:center">
      <div class="xs mute">${new Intl.DateTimeFormat('en-GB',{weekday:'short'}).format(d)}</div>
      <div class="tabular" style="font-weight:500">${d.getDate()}</div></div>`));
  }
  for(let h=8;h<20;h++){
    g.appendChild(el(`<div class="xs mute tabular" style="padding:6px;border-right:1px solid var(--hairline);text-align:right">${String(h).padStart(2,'0')}:00</div>`));
    for(let i=0;i<7;i++){
      const d = new Date(monday.getTime()+i*86400000);
      const iso = isoDateInZone(d, ORG.tz);
      const cell = el('<div style="border-top:1px solid var(--hairline);border-right:1px solid var(--hairline);min-height:44px;padding:2px"></div>');
      for(const b of live()){
        if(isoDateInZone(b.start,ORG.tz)!==iso) continue;
        if(partsInZone(b.start,ORG.tz).h!==h) continue;
        const svc = SERVICES.find(s=>s.id===b.serviceId);
        cell.appendChild(el(`<div style="background:var(--teal-100);border-left:3px solid var(--teal);border-radius:4px;padding:3px 5px;margin-bottom:2px">
          <div class="xs tabular" style="color:var(--teal-600)">${fmtTime(b.start,ORG.tz)}</div>
          <div class="xs" style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${svc.name}</div></div>`));
      }
      g.appendChild(cell);
    }
  }
  m.appendChild(cols);
  m.appendChild(el('<p class="xs mute" style="margin-top:.75rem">In the production build these blocks drag to move and resize to change duration, writing back through the same conflict check.</p>'));
}

function pgServices(m){
  m.appendChild(el('<div class="page-head"><h2 style="margin:0">Services</h2><button class="btn btn-sm">New service</button></div>'));
  for(const s of SERVICES){
    const row = el(`<div class="card" style="padding:18px 20px;margin-bottom:12px">
      <div style="display:flex;gap:1rem;align-items:flex-start;flex-wrap:wrap">
        <div style="flex:1;min-width:240px">
          <div style="font-weight:600">${s.name}</div>
          <div class="small mute">${s.desc}</div>
        </div>
        <div class="small tabular" style="text-align:right">
          <div>${s.duration} min · ${money(s.price,ORG.currency)}</div>
          <div class="mute xs">buffer ${s.bufferBefore}/${s.bufferAfter} · notice ${s.notice>=1440?(s.notice/1440)+'d':s.notice+'m'} · window ${s.maxAdvanceDays}d</div>
        </div>
      </div>
      <div class="xs mute" style="margin-top:.6rem">${s.methods.map(x=>METHOD_LABEL[x]).join(' · ')} — ${s.staff.map(id=>STAFF.find(x=>x.id===id).name).join(', ')}</div>
    </div>`);
    m.appendChild(row);
  }
  m.appendChild(el('<p class="xs mute">Every value here feeds the slot engine directly: change a buffer and the public grid changes on the next query.</p>'));
}

function pgAvailability(m){
  m.appendChild(el('<div class="page-head"><h2 style="margin:0">Availability</h2></div>'));
  const names = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  for(const st of STAFF){
    const card = el(`<div class="card" style="padding:20px;margin-bottom:16px">
      <div style="display:flex;gap:.75rem;align-items:center;margin-bottom:.75rem">
        <span class="av">${st.initials}</span>
        <div><div style="font-weight:600">${st.name}</div><div class="xs mute">${st.tz}</div></div>
      </div></div>`);
    const list = el('<div class="rule-list"></div>');
    for(let d=0;d<7;d++){
      const rules = (SCHEDULE[st.id]||{})[d] || [];
      list.appendChild(el(`<div><b>${names[d]}</b><span class="${rules.length?'tabular':'mute small'}">${
        rules.length ? rules.map(r=>r[0]+' – '+r[1]).join('  ·  ') : 'Not working'}</span></div>`));
    }
    card.appendChild(list);
    m.appendChild(card);
  }
  m.appendChild(el('<p class="xs mute">Stored as local wall-clock time plus the zone above — never as a fixed UTC offset, which is what breaks twice a year.</p>'));
}

function pgCustomers(m){
  m.appendChild(el('<div class="page-head"><h2 style="margin:0">Customers</h2></div>'));
  const map = new Map();
  for(const b of BOOKINGS){
    const k = b.customer.email;
    const e = map.get(k) || {name:b.customer.full_name, email:k, total:0, cancelled:0, last:null};
    e.total++; if(b.status==='cancelled') e.cancelled++;
    if(!e.last || b.start>e.last) e.last=b.start;
    map.set(k,e);
  }
  const rows = [...map.values()].sort((a,b)=>b.last-a.last);
  const t = el(`<div class="card" style="overflow:hidden"><table>
    <thead><tr><th>Name</th><th>Email</th><th>Bookings</th><th>Cancellations</th><th>Last appointment</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td style="font-weight:500">${r.name}</td><td class="small mute">${r.email}</td>
      <td class="tabular">${r.total}</td><td class="tabular">${r.cancelled}</td>
      <td class="tabular">${new Intl.DateTimeFormat('en-GB',{timeZone:ORG.tz,day:'2-digit',month:'short',year:'numeric'}).format(r.last)}</td></tr>`).join('')}
    </tbody></table></div>`);
  m.appendChild(t);
}

function pgStaff(m){
  m.appendChild(el('<div class="page-head"><h2 style="margin:0">Staff and roles</h2><button class="btn btn-sm">Invite someone</button></div>'));
  const roles = {s1:'Admin', s2:'Manager', s3:'Staff'};
  const t = el(`<div class="card" style="overflow:hidden"><table>
    <thead><tr><th>Person</th><th>Title</th><th>Timezone</th><th>Role</th><th>Bookable</th></tr></thead>
    <tbody>${STAFF.map(s=>`<tr>
      <td><div style="display:flex;gap:.6rem;align-items:center"><span class="av">${s.initials}</span>${s.name}</div></td>
      <td class="small mute">${s.title}</td><td class="small tabular">${s.tz}</td>
      <td><span class="pill p-completed">${roles[s.id]}</span></td>
      <td class="small">Yes</td></tr>`).join('')}</tbody></table></div>`);
  m.appendChild(t);
  m.appendChild(el(`<p class="xs mute" style="margin-top:1rem">Permissions are a set per role — a receptionist can write bookings and customers but cannot touch services, availability or billing.</p>`));
}

function pgForms(m){
  m.appendChild(el('<div class="page-head"><h2 style="margin:0">Booking form</h2><button class="btn btn-sm">Add field</button></div>'));
  const list = el('<div class="rule-list"></div>');
  for(const f of FORM_FIELDS){
    list.appendChild(el(`<div><b>${f.label}</b><span class="small mute">${f.type}${f.required?' · required':''}${f.system?' · system field':''}</span></div>`));
  }
  m.appendChild(list);
  m.appendChild(el('<p class="xs mute" style="margin-top:1rem">These rows render the form on the public page. Reorder, hide or require them without touching code.</p>'));
}

function pgNotifications(m){
  m.appendChild(el('<div class="page-head"><h2 style="margin:0">Notifications</h2></div>'));
  m.appendChild(el(`<div class="card" style="padding:20px;margin-bottom:16px">
    <p class="small" style="font-weight:500;margin-bottom:.5rem">Reminder schedule</p>
    <div class="methods"><span class="method" aria-pressed="true">24 hours before</span>
    <span class="method" aria-pressed="true">2 hours before</span>
    <span class="method">30 minutes before</span></div>
    <p class="xs mute" style="margin:.75rem 0 0">A row is written per reminder when the booking is made, and a job every five minutes sends whatever is due.</p>
  </div>`));
  m.appendChild(el(`<div class="card" style="padding:20px">
    <p class="small" style="font-weight:500;margin-bottom:.5rem">Confirmation email template</p>
    <pre style="font-family:var(--font-mono);font-size:.8125rem;white-space:pre-wrap;color:var(--mute);margin:0">Subject: Your booking is confirmed — {{service_name}} on {{start_local_date}}

Hi {{customer_name}},

Your {{service_name}} with {{staff_name}} is confirmed.

When: {{start_local_full}} ({{customer_timezone}})
How:  {{meeting_method_label}}
{{join_block}}

Need to change it? {{reschedule_url}}
Cancel: {{cancel_url}}</pre></div>`));
}

function pgSettings(m){
  m.appendChild(el('<div class="page-head"><h2 style="margin:0">Settings</h2></div>'));
  m.appendChild(el(`<div class="rule-list">
    <div><b>Organisation</b><span>${ORG.name}</span></div>
    <div><b>Booking link</b><span class="tabular small">meridian.app/book/${ORG.slug}</span></div>
    <div><b>Business timezone</b><span class="tabular small">${ORG.tz}</span></div>
    <div><b>Currency</b><span>${ORG.currency}</span></div>
    <div><b>Calendar sync</b><span class="mute small">Google and Outlook — connect in the production build</span></div>
    <div><b>Meeting links</b><span class="mute small">Zoom, Google Meet, Teams — connect in the production build</span></div>
    <div><b>Payments</b><span class="mute small">Stripe — not connected</span></div>
  </div>`));
}

/* =====================================================================
   8. ROUTER
   ===================================================================== */
function route(){
  const hash = location.hash.replace('#','') || '/';
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active', a.dataset.route===hash));
  window.scrollTo(0,0);
  if(hash==='/book') renderBook();
  else if(hash==='/app') renderApp();
  else if(hash==='/pricing') renderPricing();
  else renderHome();
}
window.addEventListener('hashchange', route);
route();
</script>
